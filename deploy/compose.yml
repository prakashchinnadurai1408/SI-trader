services:
  trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ${SI_TRADER_ENV_FILE:?Set SI_TRADER_ENV_FILE to your private environment file}
    environment:
      PORT: '8080'
      SI_TRADER_MODE: hosted
      SI_TRADER_DATA_DIR: /data
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - trader-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    restart: unless-stopped
volumes:
  trader-data:
