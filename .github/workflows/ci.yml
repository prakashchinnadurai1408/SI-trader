name: SI-Trader CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # The codebase prints rupee amounts (₹); Windows' cp1252 console codec
      # cannot encode it and raises UnicodeEncodeError. Force UTF-8 mode.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -B scripts/check_python.py
      - run: node --check nifty100_weekly/nifty100_adapter/web/app.js
      - run: node --check nifty100_weekly/nifty100_adapter/web/workspace.js
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
  browser:
    name: Browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
  packaging:
    name: Deployment packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_stormkit.py
      - name: Verify Stormkit artifact can import and enforces hosted mode
        run: |
          cd dist
          PYTHONPATH=vendor python -c 'from nifty100_weekly.nifty100_adapter.web_app import create_server; print("Artifact import passed")'
          if python start_hosted.py; then
            echo 'Hosted artifact incorrectly accepted missing configuration'
            exit 1
          fi
      - run: docker build -f deploy/Dockerfile -t si-trader-ci .
      - run: python scripts/docker_smoke.py
